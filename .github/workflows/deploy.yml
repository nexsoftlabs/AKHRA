name: Deploy (Terraform)

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/platform/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: akhra-platform-terraform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/platform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -backend=false
      - run: terraform validate

  terraform:
    name: Platform (API / UI / DB wiring)
    needs: terraform-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/platform

    env:
      TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
      TF_VAR_vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
      TF_VAR_supabase_db_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TF_VAR_jwt_signing_key: ${{ secrets.JWT_SIGNING_KEY }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
      TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
      TF_VAR_public_web_base_url: ${{ secrets.VERCEL_PRODUCTION_URL }}
      TF_VAR_database_connection_string: ${{ secrets.DATABASE_CONNECTION_STRING }}

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$VERCEL_API_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$JWT_SIGNING_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets missing — skipping terraform plan/apply. See infrastructure/terraform/platform/README.md"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Terraform state
        if: steps.deploy.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: terraform-state-akhra-platform
          path: infrastructure/terraform/platform
        continue-on-error: true

      - uses: hashicorp/setup-terraform@v3
        if: steps.deploy.outputs.ready == 'true'
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        if: steps.deploy.outputs.ready == 'true'
        run: terraform init -input=false

      - name: Terraform plan
        if: steps.deploy.outputs.ready == 'true'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: steps.deploy.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Save Terraform state
        if: steps.deploy.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-akhra-platform
          path: infrastructure/terraform/platform/terraform.tfstate
          retention-days: 90

      - name: Deployment summary
        if: steps.deploy.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: |
          terraform output -json > outputs.json
          echo "### Terraform outputs" >> "$GITHUB_STEP_SUMMARY"
          cat outputs.json >> "$GITHUB_STEP_SUMMARY"

  build-verify:
    name: Verify build (pre-deploy gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/MoviePlatform.Api -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
