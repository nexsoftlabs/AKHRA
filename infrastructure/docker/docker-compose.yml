services:
  postgres:
    image: postgres:16-alpine
    container_name: movieplatform-postgres
    environment:
      POSTGRES_DB: movieplatform
      POSTGRES_USER: movieplatform
      POSTGRES_PASSWORD: movieplatform_dev
    ports:
      - "5432:5432"
    volumes:
      - movieplatform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieplatform -d movieplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: movieplatform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: movieplatform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=movieplatform;Username=movieplatform;Password=movieplatform_dev
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  movieplatform_pg_data:
